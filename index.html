<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Bon Dosage</title>
<meta name="description" content="Recettes avec quantités précises, recalculées selon le nombre de personnes.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241f1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bon Dosage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout : appli mobile — en-tête collant, contenu en liste, barre d'onglets fixée en bas ; grille de fiches au-delà de 720px */
:root {
  --bg: #fbfaf8; --surface: #ffffff; --fg: #2a2320; --muted: #6f625b; --line: #e8e1dc;
  --accent: #d6402a; --accent-ink: #ffffff; --herb: #3f7a4a; --chip: #f3ece7;
  --entree: #3f7a4a; --plat: #d6402a; --dessert: #b8578f; --autre: #8a6d2f;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 14px rgb(0 0 0 / .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --tabs-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1b1715; --surface: #241f1c; --fg: #f2ebe6; --muted: #b3a59c; --line: #3a322d;
  --accent: #f0654d; --accent-ink: #1b1715; --herb: #7fbf88; --chip: #2f2824;
  --entree: #7fbf88; --plat: #f0654d; --dessert: #e08cc0; --autre: #d6b56a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25); color-scheme: dark } }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* en-tête */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); margin-top: env(safe-area-inset-top, 0px); }
header .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; padding-block: 8px; }
.logo { font: 800 1.35rem/1 var(--display); letter-spacing: -.02em; margin: 0; white-space: nowrap; }
.logo span { color: var(--accent); }
.search { position: relative; flex: 1; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); }
#q { width: 100%; box-sizing: border-box; font: inherit; height: 44px; padding: 0 14px 0 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); }
.htitle { flex: 1; min-width: 0; font: 600 1.05rem var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* boutons */
button { font: 600 .95rem var(--body); cursor: pointer; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 18px; min-height: 44px;
  transition-property: transform, background-color, color, border-color; transition-duration: 150ms; transition-timing-function: ease-out; }
button:active { transform: scale(.96); }
.icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-color: transparent; background: transparent; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.danger { color: var(--accent); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.fav svg { transition-property: fill, transform; transition-duration: 200ms; transition-timing-function: ease-out; }
.fav[aria-pressed="true"] { color: var(--accent); }
.fav[aria-pressed="true"] svg { fill: currentColor; transform: scale(1.08); }

main { padding-block: 16px calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 24px); }
h1, h2 { font-family: var(--display); text-wrap: balance; letter-spacing: -.02em; margin: 0; }
p, li { text-wrap: pretty; }

/* catégories : défilement horizontal sur mobile */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 38px; background: var(--chip); border-color: transparent; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.count { color: var(--muted); font-size: .88rem; margin: 0 0 10px; font-variant-numeric: tabular-nums; }

/* fiches : rangées sur mobile, grille sur grand écran */
.grid { display: grid; gap: 10px; }
.card { position: relative; display: grid; grid-template-columns: 76px minmax(0, 1fr) 44px; align-items: center; gap: 12px; padding: 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.thumb { width: 76px; height: 76px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; font: 800 1.9rem/1 var(--display); color: var(--surface); }
.thumb img, .hero img, #f-photo-prev { width: 100%; height: 100%; object-fit: cover; display: block; outline: 1px solid rgb(0 0 0 / .1); outline-offset: -1px; }
@media (prefers-color-scheme: dark) { .thumb img, .hero img, #f-photo-prev { outline-color: rgb(255 255 255 / .1); } }
.card .open { all: unset; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.card .open::after { content: ""; position: absolute; inset: 0 52px 0 0; border-radius: 18px; }
.card .open:focus-visible { outline: none; }
.card:has(.open:focus-visible) { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.card h2 { font-size: 1.05rem; line-height: 1.25; }
.card .meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 0 10px; font-variant-numeric: tabular-nums; }
.card .fav { position: relative; z-index: 1; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; } }
.cat { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; font-weight: 700; }
.mine { font-size: .72rem; font-weight: 700; color: var(--herb); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }

/* fiche recette */
.hero { margin: -16px -16px 18px; }
.hero img { aspect-ratio: 4 / 3; max-height: 46vh; height: auto; }
.hero figcaption { font-size: .72rem; color: var(--muted); padding: 4px 16px 0; text-align: right; }
.hero a { color: inherit; }
@media (min-width: 720px) { .hero { margin: 0 0 18px; } .hero img { border-radius: 18px; } .hero figcaption { padding-inline: 0; } }
.r-cat { display: inline-block; margin-bottom: 6px; }
.r-head h1 { font-size: clamp(1.7rem, 7vw, 2.8rem); line-height: 1.08; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.facts span { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: .88rem; }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 0 0 24px; }
.times div { background: var(--surface); padding: 10px 12px; }
.times small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: .66rem; color: var(--muted); font-weight: 700; }
.times strong { font: 600 1.15rem var(--display); font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 36px; } }
.cols h2 { font-size: 1.3rem; margin-bottom: 12px; }
.serv { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; padding: 6px; border-radius: 999px; background: var(--chip); }
.serv button { width: 44px; height: 44px; padding: 0; font-size: 1.3rem; background: var(--surface); }
.serv output { font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.ing { list-style: none; padding: 0; margin: 0; }
.ing li { border-bottom: 1px solid var(--line); }
.ing label { display: grid; grid-template-columns: 24px 6.5rem minmax(0, 1fr); gap: 10px; align-items: center; min-height: 48px; cursor: pointer; }
.ing input { width: 20px; height: 20px; min-height: 0; accent-color: var(--herb); margin: 0; }
.ing .q { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; color: var(--herb); }
.ing input:checked ~ span { text-decoration: line-through; color: var(--muted); }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 18px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 12px; }
.steps li::before { content: counter(s); font: 800 1.5rem/1.15 var(--display); color: var(--accent); }
.tip { margin-top: 24px; padding: 14px 16px; border-left: 4px solid var(--herb); background: var(--chip); border-radius: 0 12px 12px 0; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }

/* formulaire */
form { display: grid; gap: 16px; max-width: 760px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
label.f small { font-weight: 400; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 16px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); min-width: 0; }
textarea { min-height: 150px; resize: vertical; }
.err { color: var(--accent); font-weight: 600; min-height: 1.4em; margin: 0; }
.note { color: var(--muted); font-size: .88rem; margin: 0; }
.photo-field { display: grid; gap: 8px; font-weight: 600; font-size: .92rem; }
#f-photo-prev { aspect-ratio: 4 / 3; height: auto; max-width: 320px; border-radius: 14px; }
.photo-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-weight: 600; }
.btn:focus-within { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

/* barre d'onglets */
nav.tabs { position: fixed; inset: auto 0 0; z-index: 6; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
nav.tabs button { flex: 1; display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 4px 0; border: 0; background: none; color: var(--muted); font-size: .75rem; border-radius: 14px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"] svg { fill: color-mix(in srgb, currentColor 18%, transparent); }

.view-enter { animation: enter 220ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .view-enter { animation: none; } button:active { transform: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
</svg>

<header><div class="wrap" id="hbar"></div></header>

<main class="wrap">
  <section id="list">
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </section>
  <section id="detail" hidden></section>
  <section id="edit" hidden>
    <form id="form" novalidate>
      <label class="f">Titre<input id="f-titre" required maxlength="120"></label>
      <div class="row">
        <label class="f">Catégorie<select id="f-cat"><option>Entrée</option><option selected>Plat</option><option>Dessert</option><option>Autre</option></select></label>
        <label class="f">Personnes<input id="f-pers" type="number" inputmode="numeric" min="1" max="50" value="4"></label>
        <label class="f">Difficulté<select id="f-diff"><option>Très facile</option><option selected>Facile</option><option>Moyenne</option><option>Difficile</option></select></label>
        <label class="f">Coût<select id="f-cout"><option>Bon marché</option><option selected>Moyen</option><option>Assez cher</option></select></label>
      </div>
      <div class="row">
        <label class="f">Préparation <small>(min)</small><input id="f-prep" type="number" inputmode="numeric" min="0" value="15"></label>
        <label class="f">Cuisson <small>(min)</small><input id="f-cuis" type="number" inputmode="numeric" min="0" value="0"></label>
        <label class="f">Repos <small>(min)</small><input id="f-repos" type="number" inputmode="numeric" min="0" value="0"></label>
      </div>
      <label class="f">Ingrédients <small>Un par ligne, quantité puis unité : « 250 g de farine », « 3 œufs », « 1 c. à soupe d'huile », « sel »</small><textarea id="f-ing"></textarea></label>
      <label class="f">Étapes <small>Une étape par ligne, dans l'ordre</small><textarea id="f-steps"></textarea></label>
      <label class="f">Astuce <small>(facultatif)</small><textarea id="f-tip" style="min-height:80px"></textarea></label>
      <div class="photo-field">Photo <small class="note">(facultatif)</small>
        <img id="f-photo-prev" alt="Aperçu de la photo" hidden>
        <div class="photo-btns">
          <label class="btn"><span id="f-photo-label">Choisir une photo</span><input id="f-photo" type="file" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label>
          <button type="button" id="f-photo-del" class="danger" hidden>Retirer la photo</button>
        </div>
      </div>
      <p class="note">Vos recettes sont enregistrées sur ce téléphone uniquement.</p>
      <p class="err" id="f-err" role="alert"></p>
      <button class="primary" type="submit">Enregistrer la recette</button>
    </form>
  </section>
</main>

<nav class="tabs" aria-label="Navigation"><div class="in">
  <button data-tab="list"><svg class="i"><use href="#i-book"/></svg>Recettes</button>
  <button data-tab="favs"><svg class="i"><use href="#i-heart"/></svg>Favoris</button>
  <button data-tab="new"><svg class="i"><use href="#i-plus"/></svg>Ajouter</button>
</div></nav>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/\p{M}/gu, "").replace(/œ/g, "oe").toLowerCase(); // recherche sans accents
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const CATS = ["Tous", "Entrée", "Plat", "Dessert", "Autre"];
const CAT_COLOR = { "Entrée": "var(--entree)", "Plat": "var(--plat)", "Dessert": "var(--dessert)", "Autre": "var(--autre)" };
const METRIC = ["kg", "g", "mg", "l", "dl", "cl", "ml"];
const UNITS = [...METRIC, "c. à soupe", "c. à café", "cuillère à soupe", "cuillères à soupe", "cuillère à café", "cuillères à café", "cs", "cc",
  "pincée", "pincées", "sachet", "sachets", "gousse", "gousses", "tranche", "tranches", "brin", "brins", "feuille", "feuilles",
  "boîte", "boîtes", "verre", "verres", "bouquet", "bouquets", "noix", "botte", "bottes", "pot", "pots", "rouleau", "rouleaux"]
  .sort((a, b) => b.length - a.length);
const UNIT_RE = UNITS.map(u => u.replace(/[.]/g, "\\.")).join("|");
const LINE_RE = new RegExp(`^\\s*(\\d+(?:[.,]\\d+)?(?:\\/\\d+)?)?\\s*(?:(${UNIT_RE})(?=\\s|$))?\\s*(?:de\\s+|d['’]\\s*)?(.*)$`, "i");

function parseLine(line) {
  const m = line.match(LINE_RE);
  let q = null;
  if (m[1]) q = m[1].includes("/") ? m[1].split("/").reduce((a, b) => a / b) : parseFloat(m[1].replace(",", "."));
  return { q, u: m[2] ? m[2].toLowerCase() : "", n: (m[3] || "").trim() };
}

function fmtQty(x, u) {
  if (x == null) return "";
  if (METRIC.includes(u)) {
    const r = x < 10 ? Math.round(x * 10) / 10 : x < 100 ? Math.round(x) : Math.round(x / 5) * 5;
    return String(r).replace(".", ",");
  }
  // œufs, cuillères, gousses : au quart près, affiché en fractions
  const r = Math.max(0.25, Math.round(x * 4) / 4), whole = Math.floor(r), frac = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[r - whole] || "";
  return (whole || !frac ? whole : "") + frac;
}
// change d'unité quand la quantité recalculée devient grande ou petite (100 cl → 1 l, 0,5 kg → 500 g)
function scaled(q, u) {
  const up = { g: [1000, "kg"], ml: [1000, "l"], cl: [100, "l"] }[u], down = { kg: [1000, "g"], l: [100, "cl"] }[u];
  if (up && q >= up[0]) return [q / up[0], up[1]];
  if (down && q < 1) return [q * down[0], down[1]];
  return [q, u];
}
const ingText = i =>[i.q != null ? fmtQty(i.q, i.u) : "", i.u, i.n].filter(Boolean).join(" ");
const mins = m => { m = +m || 0; return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? String(m % 60).padStart(2, "0") : ""}` : `${m} min`; };
const total = r => (+r.prep || 0) + (+r.cuisson || 0) + (+r.repos || 0);

// self-check du parseur
console.assert(JSON.stringify(parseLine("250 g de farine")) === '{"q":250,"u":"g","n":"farine"}');
console.assert(JSON.stringify(parseLine("1/2 c. à café de sel")) === '{"q":0.5,"u":"c. à café","n":"sel"}');
console.assert(JSON.stringify(parseLine("3 œufs")) === '{"q":3,"u":"","n":"œufs"}');
console.assert(JSON.stringify(parseLine("1 gousse d'ail")) === '{"q":1,"u":"gousse","n":"ail"}');
console.assert(JSON.stringify(parseLine("1,5 kg de bœuf")) === '{"q":1.5,"u":"kg","n":"bœuf"}');
console.assert(fmtQty(1.5, "") === "1½" && fmtQty(0.5, "") === "½" && fmtQty(333, "g") === "335");
console.assert(scaled(100, "cl").join() === "1,l" && scaled(1500, "g").join() === "1.5,kg" && scaled(0.6, "kg").join() === "600,g");
console.assert(fold("Crème Brûlée") === "creme brulee" && fold("Bœuf") === "boeuf");

// stockage sur le téléphone (localStorage peut être bloqué : navigation privée, etc.)
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

let base = [], perso = store.get("bd-recettes", []), favs = new Set(store.get("bd-favoris", []));
let loaded = false, loadError = false, recipes = [], filter = "Tous", currentId = null, persons = 0, editingId = null, confirmDel = false;
let view = "list", tab = "list";       // tab = onglet actif de la barre du bas

const norm = r => ({ ...r, ingredients: (r.ingredients || []).map(i => typeof i === "string" ? parseLine(i) : i) });
function sync() {
  recipes = [...base.map(r => ({ ...norm(r), base: true })), ...perso.map(norm)].sort((a, b) => a.titre.localeCompare(b.titre, "fr"));
}

function setView(v) {
  view = v;
  for (const s of ["list", "detail", "edit"]) $(s).hidden = s !== (v === "favs" ? "list" : v);
  const sec = $(v === "favs" ? "list" : v);
  sec.classList.remove("view-enter"); void sec.offsetWidth; sec.classList.add("view-enter");
  window.scrollTo(0, 0);
  renderHeader(); renderTabs();
}

function renderHeader() {
  const r = recipes.find(x => x.id === currentId);
  if (view === "list" || view === "favs") {
    const q = $("q")?.value ?? "";
    $("hbar").innerHTML = `<h1 class="logo">Le Bon <span>Dosage</span></h1>
      <label class="search">${icon("search")}<input id="q" type="search" placeholder="Recette, ingrédient…" aria-label="Rechercher une recette ou un ingrédient" value="${esc(q)}"></label>`;
    $("q").addEventListener("input", renderList);
  } else if (view === "detail" && r) {
    $("hbar").innerHTML = `<button class="icon-btn" data-act="back" aria-label="Retour">${icon("back")}</button>
      <span class="htitle">${esc(r.titre)}</span>${favButton(r.id)}`;
  } else if (view === "edit") {
    $("hbar").innerHTML = `<button class="icon-btn" data-act="cancel" aria-label="Annuler">${icon("back")}</button>
      <span class="htitle">${editingId ? "Modifier la recette" : "Nouvelle recette"}</span>`;
  }
}

function renderTabs() {
  for (const b of document.querySelectorAll("nav.tabs button"))
    b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
}

const favButton = id => `<button class="icon-btn fav" data-fav="${esc(id)}" aria-pressed="${favs.has(id)}" aria-label="${favs.has(id) ? "Retirer des favoris" : "Ajouter aux favoris"}">${icon("heart")}</button>`;

function renderList() {
  const onlyFavs = view === "favs";
  $("chips").innerHTML = CATS.map(c => `<button aria-pressed="${c === filter}" data-cat="${c}">${c}</button>`).join("");
  const q = fold($("q")?.value.trim());
  const items = recipes.filter(r => (!onlyFavs || favs.has(r.id)) && (filter === "Tous" || r.categorie === filter) &&
    (!q || fold(r.titre).includes(q) || r.ingredients.some(i => fold(i.n).includes(q))));
  $("count").textContent = items.length ? `${items.length} recette${items.length > 1 ? "s" : ""}${onlyFavs ? " en favori" + (items.length > 1 ? "s" : "") : ""}` : "";
  $("grid").innerHTML = items.map(r => `<article class="card">
    <div class="thumb" style="background:${CAT_COLOR[r.categorie] || CAT_COLOR.Autre}" aria-hidden="true">${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy" decoding="async">` : esc((r.titre || "?").trim()[0].toUpperCase())}</div>
    <button class="open" data-id="${esc(r.id)}">
      <span><span class="cat" style="color:${CAT_COLOR[r.categorie] || CAT_COLOR.Autre}">${esc(r.categorie)}</span>${r.base ? "" : ` · <span class="mine">Ma recette</span>`}</span>
      <h2>${esc(r.titre)}</h2>
      <span class="meta"><span>${mins(total(r))}</span><span>${esc(r.difficulte)}</span><span>${esc(r.cout)}</span></span>
    </button>
    ${favButton(r.id)}
  </article>`).join("");
  $("empty").hidden = items.length > 0 || !loaded;
  $("empty").textContent = loadError && !recipes.length ? "Impossible de charger les recettes. Vérifiez la connexion et rouvrez l'appli."
    : onlyFavs && !favs.size ? "Aucun favori pour l'instant. Touchez le cœur d'une recette pour la retrouver ici."
    : "Aucune recette ne correspond à votre recherche.";
}

function renderDetail() {
  const r = recipes.find(x => x.id === currentId);
  if (!r) { currentId = null; setView(tab); renderList(); return; }
  const base = +r.personnes || 1, k = persons / base, color = CAT_COLOR[r.categorie] || CAT_COLOR.Autre;
  $("detail").innerHTML = `
    ${r.photo ? `<figure class="hero"><img src="${esc(r.photo)}" alt="${esc(r.titre)}">${r.credit
      ? `<figcaption>Photo : <a href="${esc(r.creditUrl)}" target="_blank" rel="noopener">${esc(r.credit)}</a></figcaption>` : ""}</figure>` : ""}
    <div class="r-head"><span class="cat r-cat" style="color:${color}">${esc(r.categorie)}</span><h1>${esc(r.titre)}</h1></div>
    <div class="facts"><span>${esc(r.difficulte)}</span><span>${esc(r.cout)}</span><span>Pour ${base} pers.</span></div>
    <div class="times">
      <div><small>Total</small><strong>${mins(total(r))}</strong></div>
      <div><small>Préparation</small><strong>${mins(r.prep)}</strong></div>
      <div><small>Cuisson</small><strong>${mins(r.cuisson)}</strong></div>
      ${+r.repos ? `<div><small>Repos</small><strong>${mins(r.repos)}</strong></div>` : ""}
    </div>
    <div class="cols">
      <div>
        <h2>Ingrédients</h2>
        <div class="serv"><button data-act="minus" aria-label="Une personne de moins">−</button><output aria-live="polite">${persons} personne${persons > 1 ? "s" : ""}</output><button data-act="plus" aria-label="Une personne de plus">+</button></div>
        <ul class="ing">${r.ingredients.map((i, n) => `<li><label><input type="checkbox" id="ing-${n}"><span class="q">${esc(i.q != null ? ((q, u) => fmtQty(q, u) + (u ? " " + u : ""))(...scaled(i.q * k, i.u)) : i.u)}</span><span>${esc(i.n)}</span></label></li>`).join("")}</ul>
      </div>
      <div>
        <h2>Préparation</h2>
        <ol class="steps">${(r.etapes || []).map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
        ${r.astuce ? `<div class="tip"><b>Astuce :</b> ${esc(r.astuce)}</div>` : ""}
      </div>
    </div>
    ${r.base ? "" : `<div class="r-actions">${confirmDel
      ? `<button class="danger" data-act="del-ok">Confirmer la suppression</button><button data-act="del-no">Annuler</button>`
      : `<button data-act="edit">Modifier</button><button class="danger" data-act="del">Supprimer</button>`}</div>`}`;
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id); if (!r) return;
  currentId = id; persons = +r.personnes || 1; confirmDel = false; setView("detail"); renderDetail();
}

function openEdit(r) {
  editingId = r?.id || null;
  $("f-titre").value = r?.titre || ""; $("f-cat").value = r?.categorie || "Plat"; $("f-pers").value = r?.personnes || 4;
  $("f-diff").value = r?.difficulte || "Facile"; $("f-cout").value = r?.cout || "Moyen";
  $("f-prep").value = r?.prep ?? 15; $("f-cuis").value = r?.cuisson ?? 0; $("f-repos").value = r?.repos ?? 0;
  $("f-ing").value = (r?.ingredients || []).map(ingText).join("\n");
  $("f-steps").value = (r?.etapes || []).join("\n"); $("f-tip").value = r?.astuce || ""; $("f-err").textContent = "";
  setFormPhoto(r?.photo || "");
  if (!r) { tab = "new"; currentId = null; }
  setView("edit");
}

// photo des recettes perso : réduite à 800 px en JPEG puis stockée en data URL avec la recette
// shortcut: localStorage (~5 Mo) tient une quarantaine de photos ; passer à IndexedDB au-delà
let formPhoto = "";
function setFormPhoto(src) {
  formPhoto = src;
  $("f-photo-prev").hidden = !src; if (src) $("f-photo-prev").src = src; else $("f-photo-prev").removeAttribute("src");
  $("f-photo-del").hidden = !src; $("f-photo-label").textContent = src ? "Changer la photo" : "Choisir une photo";
}
$("f-photo").addEventListener("change", e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = Object.assign(document.createElement("canvas"), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); setFormPhoto(c.toDataURL("image/jpeg", 0.72)); $("f-err").textContent = "";
  };
  img.onerror = () => { URL.revokeObjectURL(url); $("f-err").textContent = "Cette image n'a pas pu être lue. Essayez une photo JPEG ou PNG."; };
  img.src = url;
});
$("f-photo-del").addEventListener("click", () => setFormPhoto(""));

function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set("bd-favoris", [...favs]);
  for (const b of document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`)) {
    b.setAttribute("aria-pressed", favs.has(id)); b.setAttribute("aria-label", favs.has(id) ? "Retirer des favoris" : "Ajouter aux favoris");
  }
  if (view === "favs") renderList();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const lines = id => $(id).value.split("\n").map(s => s.trim()).filter(Boolean);
  const data = {
    id: editingId || "p-" + Date.now().toString(36),
    titre: $("f-titre").value.trim(), categorie: $("f-cat").value, personnes: Math.max(1, Math.round(+$("f-pers").value || 1)),
    difficulte: $("f-diff").value, cout: $("f-cout").value,
    prep: Math.max(0, +$("f-prep").value || 0), cuisson: Math.max(0, +$("f-cuis").value || 0), repos: Math.max(0, +$("f-repos").value || 0),
    ingredients: lines("f-ing"), etapes: lines("f-steps"), astuce: $("f-tip").value.trim(),
    ...(formPhoto && { photo: formPhoto })
  };
  const err = !data.titre ? "Donnez un titre à la recette." : !data.ingredients.length ? "Ajoutez au moins un ingrédient."
    : !data.etapes.length ? "Ajoutez au moins une étape de préparation." : "";
  if (err) { $("f-err").textContent = err; return; }
  const next = perso.filter(r => r.id !== data.id).concat(data);
  if (!store.set("bd-recettes", next)) { $("f-err").textContent = "Impossible d'enregistrer sur ce téléphone : stockage plein ou navigation privée. Retirez la photo ou supprimez une ancienne recette."; return; }
  perso = next; sync();
  if (tab === "new") tab = "list";
  openRecipe(data.id);
});

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.fav) { toggleFav(t.dataset.fav); return; }
  if (t.dataset.cat) { filter = t.dataset.cat; renderList(); return; }
  if (t.dataset.id) { openRecipe(t.dataset.id); return; }
  if (t.dataset.tab) {
    if (t.dataset.tab === "new") { openEdit(null); return; }
    tab = t.dataset.tab; currentId = null; setView(tab); renderList(); return;
  }
  const r = recipes.find(x => x.id === currentId);
  switch (t.dataset.act) {
    case "back": currentId = null; setView(tab); renderList(); break;
    case "cancel":
      if (tab === "new") tab = "list";
      if (currentId) { setView("detail"); renderDetail(); } else { setView(tab); renderList(); }
      break;
    case "plus": persons = Math.min(50, persons + 1); renderDetail(); break;
    case "minus": persons = Math.max(1, persons - 1); renderDetail(); break;
    case "edit": openEdit(r); break;
    case "del": confirmDel = true; renderDetail(); break;
    case "del-no": confirmDel = false; renderDetail(); break;
    case "del-ok": {
      const next = perso.filter(x => x.id !== currentId);
      if (!store.set("bd-recettes", next)) { confirmDel = false; renderDetail(); break; }
      perso = next; if (favs.has(currentId)) toggleFav(currentId);
      sync(); currentId = null; setView(tab); renderList();
      break;
    }
  }
});

sync(); setView("list"); renderList();
fetch("recettes.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { base = d; })
  .catch(() => { loadError = true; })
  .finally(() => {
    sync(); loaded = true; renderList();
    const id = location.hash.slice(1);
    if (id && recipes.some(r => r.id === id)) openRecipe(id);
  });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
