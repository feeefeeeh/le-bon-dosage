<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Bon Dosage</title>
<meta name="description" content="Recettes avec quantités précises, recalculées selon le nombre de personnes.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bon Dosage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout : mise en page de site de recettes grand public — accueil en grille de cartes photo 2 colonnes,
   fiche centrée (titre, photo, ligne temps • difficulté • coût, ingrédients en cartes, étapes numérotées) */
:root {
  --bg: #ffffff; --surface: #ffffff; --soft: #f5f2f0; --fg: #2f2a28; --muted: #77706c; --line: #e9e4e1;
  --accent: #e2533d; --accent-soft: #fdeeea; --accent-ink: #ffffff; --ok: #3f7a4a;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .07);
  --logo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --tabs-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1c1a19; --surface: #262321; --soft: #2e2a28; --fg: #f3eeeb; --muted: #b0a7a2; --line: #3b3633;
  --accent: #f26b55; --accent-soft: #3a2723; --accent-ink: #1c1a19; --ok: #7fbf88;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3); color-scheme: dark } }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p, li { text-wrap: pretty; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

/* en-tête */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); margin-top: env(safe-area-inset-top, 0px); }
header .wrap { display: flex; align-items: center; gap: 8px; min-height: 58px; }
.logo { font: 800 1.4rem/1 var(--logo); letter-spacing: -.02em; margin: 0; white-space: nowrap; color: var(--accent); flex: 1; }
.logo span { color: var(--fg); }
.htitle { flex: 1; min-width: 0; font-weight: 800; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* boutons */
button { font: 700 .95rem var(--body); cursor: pointer; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 18px; min-height: 44px;
  transition-property: transform, background-color, color, border-color, opacity; transition-duration: 150ms; transition-timing-function: ease-out; }
button:active { transform: scale(.96); }
.round { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); flex: none; }
.round.big { width: 52px; height: 52px; }
.ghost { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-color: transparent; background: transparent; flex: none; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.danger { color: var(--accent); }
.fav svg { transition-property: fill, transform; transition-duration: 200ms; transition-timing-function: ease-out; }
.fav[aria-pressed="true"] svg { fill: currentColor; transform: scale(1.08); }

main { padding-block: 16px calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 28px); }

/* titre de section : icône + texte + filet */
.sec { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
.sec svg { color: var(--accent); width: 22px; height: 22px; }
.sec h2 { font-size: 1.3rem; font-weight: 800; white-space: nowrap; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--fg); opacity: .5; }

/* accueil */
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; color: var(--accent); }
#q { width: 100%; box-sizing: border-box; font: inherit; height: 50px; padding: 0 16px 0 48px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); }
#q:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 14px -16px 0; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 38px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.count { color: var(--muted); font-size: .88rem; margin: -6px 0 12px; font-variant-numeric: tabular-nums; }

/* cartes photo */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 16px; } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { position: relative; display: grid; gap: 6px; align-content: start; }
.pic { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--soft); display: grid; place-items: center; font: 800 2.4rem/1 var(--logo); color: var(--muted); }
.pic img, .hero img, #f-photo-prev { width: 100%; height: 100%; object-fit: cover; display: block; outline: 1px solid rgb(0 0 0 / .1); outline-offset: -1px; }
@media (prefers-color-scheme: dark) { .pic img, .hero img, #f-photo-prev { outline-color: rgb(255 255 255 / .1); } }
.card .open { all: unset; cursor: pointer; display: grid; gap: 2px; }
.card .open::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
.card .open:focus-visible { outline: none; }
.card:has(.open:focus-visible) .pic { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.card h3 { font-size: 1rem; font-weight: 800; line-height: 1.25; }
.card .meta { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.mine { color: var(--ok); font-weight: 700; }
.card .fav { position: absolute; top: 8px; right: 8px; z-index: 1; width: 40px; height: 40px; min-height: 0; padding: 0; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.card .fav svg { width: 20px; height: 20px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

/* fiche recette */
.r-head { text-align: center; display: grid; gap: 6px; }
.r-head h1 { font-size: clamp(1.6rem, 6.5vw, 2.4rem); font-weight: 800; line-height: 1.15; }
.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.tags span + span::before { content: "·"; margin-right: 6px; }
.hero { margin: 16px 0 0; }
.hero img { aspect-ratio: 4 / 3; height: auto; border-radius: 16px; }
.hero figcaption { font-size: .72rem; color: var(--muted); padding-top: 4px; text-align: right; }
.hero a { color: inherit; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px; margin: 18px 0 14px; font-size: .95rem; }
.facts span { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.facts svg { width: 18px; height: 18px; color: var(--accent); }
.facts .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }
.actions { display: flex; justify-content: center; gap: 16px; }
.serv { display: flex; align-items: stretch; width: min(100%, 300px); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.serv button { width: 54px; min-height: 46px; padding: 0; border: 0; border-radius: 0; font-size: 1.4rem; font-weight: 600; }
.serv output { flex: 1; display: grid; place-items: center; border-inline: 1.5px solid var(--line); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.ings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; list-style: none; padding: 0; margin: 0; }
@media (min-width: 640px) { .ings { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.ing { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; height: 100%; display: grid; align-content: start; justify-items: center; gap: 2px; padding: 14px 8px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-align: center; font-size: .9rem; line-height: 1.3;
  transition-property: opacity, transform; transition-duration: 150ms; }
.ing:active { transform: scale(.97); }
.ing:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.ing b { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.ing[aria-pressed="true"] { opacity: .4; }
.ing[aria-pressed="true"] span { text-decoration: line-through; }
.hint { color: var(--muted); font-size: .8rem; margin: 10px 0 0; }
.times { background: var(--soft); border-radius: 16px; padding: 12px 16px; text-align: center; font-variant-numeric: tabular-nums; }
.times .tot { padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.times .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); font-size: .92rem; }
.times b { display: block; font-weight: 700; }
.steps { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 22px; }
.steps h3 { font-size: .95rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
.steps p { margin: 0; font-size: 1.02rem; }
.note { margin-top: 26px; padding: 14px 16px; border-radius: 16px; background: var(--accent-soft); }
.note h3 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
.note p { margin: 0; }
.note .src { margin-top: 8px; font-size: .88rem; }
.more { display: grid; grid-auto-flow: column; grid-auto-columns: 42%; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; }
.more::-webkit-scrollbar { display: none; }
.more .card { scroll-snap-align: start; }
@media (min-width: 640px) { .more { grid-auto-columns: 30%; } }
.r-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }

/* formulaire */
form { display: grid; gap: 16px; max-width: 760px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
label.f, .photo-field { display: grid; gap: 4px; font-weight: 700; font-size: .92rem; }
label.f small, .photo-field small { font-weight: 400; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 16px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); min-width: 0; }
textarea { min-height: 150px; resize: vertical; }
.err { color: var(--accent); font-weight: 700; min-height: 1.4em; margin: 0; }
.small { color: var(--muted); font-size: .88rem; margin: 0; }
#f-photo-prev { aspect-ratio: 4 / 3; height: auto; max-width: 320px; border-radius: 14px; }
.photo-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; background: var(--surface); cursor: pointer; font-weight: 700; }
.btn:focus-within { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

/* barre d'onglets */
nav.tabs { position: fixed; inset: auto 0 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
nav.tabs button { flex: 1; display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 4px 0; border: 0; background: none; color: var(--muted); font-size: .75rem; border-radius: 14px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"] svg { fill: color-mix(in srgb, currentColor 18%, transparent); }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 16px); translate: -50% 0; z-index: 7; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem;
  transition-property: opacity, translate; transition-duration: 200ms; }
.toast[hidden] { display: block !important; opacity: 0; translate: -50% 8px; pointer-events: none; }
.view-enter { animation: enter 220ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .view-enter { animation: none; } button:active, .ing:active { transform: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-toque" viewBox="0 0 24 24"><path d="M7 14.5V20h10v-5.5"/><path d="M7 14.5A4 4 0 0 1 6.5 6.6 4.5 4.5 0 0 1 12 4a4.5 4.5 0 0 1 5.5 2.6A4 4 0 0 1 17 14.5z"/><path d="M7 17h10"/></symbol>
  <symbol id="i-euro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8.5a4 4 0 1 0 0 7M7.5 11h5M7.5 13.5h5"/></symbol>
  <symbol id="i-basket" viewBox="0 0 24 24"><path d="M4 10h16l-1.5 9h-13z"/><path d="M8 10l3-6M16 10l-3-6M9 14v2M12 14v2M15 14v2"/></symbol>
  <symbol id="i-whisk" viewBox="0 0 24 24"><path d="M14 10l7-7"/><path d="M14 10c-2-2-7-3-9.5-.5S5 16 7 18s6.5 4.5 9 2S16 12 14 10z"/><path d="M8.5 12.5c1.5 1.5 3 3 4 3.5"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
</svg>

<header><div class="wrap" id="hbar"></div></header>

<main class="wrap">
  <section id="list">
    <label class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Une recette, un ingrédient…" aria-label="Rechercher une recette ou un ingrédient">
    </label>
    <div class="chips" id="chips"></div>
    <div class="sec"><svg class="i"><use href="#i-spark"/></svg><h2 id="list-title">Nos recettes</h2></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </section>
  <section id="detail" hidden></section>
  <section id="edit" hidden>
    <form id="form" novalidate>
      <label class="f">Titre<input id="f-titre" required maxlength="120"></label>
      <div class="row">
        <label class="f">Catégorie<select id="f-cat"><option>Entrée</option><option selected>Plat</option><option>Dessert</option><option>Autre</option></select></label>
        <label class="f">Personnes<input id="f-pers" type="number" inputmode="numeric" min="1" max="50" value="4"></label>
        <label class="f">Difficulté<select id="f-diff"><option>Très facile</option><option selected>Facile</option><option>Moyenne</option><option>Difficile</option></select></label>
        <label class="f">Coût<select id="f-cout"><option>Bon marché</option><option selected>Moyen</option><option>Assez cher</option></select></label>
      </div>
      <div class="row">
        <label class="f">Préparation <small>(min)</small><input id="f-prep" type="number" inputmode="numeric" min="0" value="15"></label>
        <label class="f">Cuisson <small>(min)</small><input id="f-cuis" type="number" inputmode="numeric" min="0" value="0"></label>
        <label class="f">Repos <small>(min)</small><input id="f-repos" type="number" inputmode="numeric" min="0" value="0"></label>
      </div>
      <label class="f">Ingrédients <small>Un par ligne, quantité puis unité : « 250 g de farine », « 3 œufs », « 1 c. à soupe d'huile », « sel »</small><textarea id="f-ing"></textarea></label>
      <label class="f">Étapes <small>Une étape par ligne, dans l'ordre</small><textarea id="f-steps"></textarea></label>
      <label class="f">Astuce <small>(facultatif)</small><textarea id="f-tip" style="min-height:80px"></textarea></label>
      <div class="photo-field">Photo <small>(facultatif)</small>
        <img id="f-photo-prev" alt="Aperçu de la photo" hidden>
        <div class="photo-btns">
          <label class="btn"><span id="f-photo-label">Choisir une photo</span><input id="f-photo" type="file" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label>
          <button type="button" id="f-photo-del" class="danger" hidden>Retirer la photo</button>
        </div>
      </div>
      <p class="small">Vos recettes sont enregistrées sur ce téléphone uniquement.</p>
      <p class="err" id="f-err" role="alert"></p>
      <button class="primary" type="submit">Enregistrer la recette</button>
    </form>
  </section>
</main>

<nav class="tabs" aria-label="Navigation"><div class="in">
  <button data-tab="list"><svg class="i"><use href="#i-book"/></svg>Recettes</button>
  <button data-tab="favs"><svg class="i"><use href="#i-heart"/></svg>Favoris</button>
  <button data-tab="new"><svg class="i"><use href="#i-plus"/></svg>Ajouter</button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/\p{M}/gu, "").replace(/œ/g, "oe").toLowerCase(); // recherche sans accents
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const CATS = ["Tous", "Entrée", "Plat", "Dessert", "Autre"];
const METRIC = ["kg", "g", "mg", "l", "dl", "cl", "ml"];
const UNITS = [...METRIC, "c. à soupe", "c. à café", "cuillère à soupe", "cuillères à soupe", "cuillère à café", "cuillères à café", "cs", "cc",
  "pincée", "pincées", "sachet", "sachets", "gousse", "gousses", "tranche", "tranches", "brin", "brins", "feuille", "feuilles",
  "boîte", "boîtes", "verre", "verres", "bouquet", "bouquets", "noix", "botte", "bottes", "pot", "pots", "rouleau", "rouleaux"]
  .sort((a, b) => b.length - a.length);
const UNIT_RE = UNITS.map(u => u.replace(/[.]/g, "\\.")).join("|");
const LINE_RE = new RegExp(`^\\s*(\\d+(?:[.,]\\d+)?(?:\\/\\d+)?)?\\s*(?:(${UNIT_RE})(?=\\s|$))?\\s*(?:de\\s+|d['’]\\s*)?(.*)$`, "i");

function parseLine(line) {
  const m = line.match(LINE_RE);
  let q = null;
  if (m[1]) q = m[1].includes("/") ? m[1].split("/").reduce((a, b) => a / b) : parseFloat(m[1].replace(",", "."));
  return { q, u: m[2] ? m[2].toLowerCase() : "", n: (m[3] || "").trim() };
}

function fmtQty(x, u) {
  if (x == null) return "";
  if (METRIC.includes(u)) {
    const r = x < 10 ? Math.round(x * 10) / 10 : x < 100 ? Math.round(x) : Math.round(x / 5) * 5;
    return String(r).replace(".", ",");
  }
  // œufs, cuillères, gousses : au quart près, affiché en fractions
  const r = Math.max(0.25, Math.round(x * 4) / 4), whole = Math.floor(r), frac = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[r - whole] || "";
  return (whole || !frac ? whole : "") + frac;
}
// change d'unité quand la quantité recalculée devient grande ou petite (100 cl → 1 l, 0,5 kg → 500 g)
function scaled(q, u) {
  const up = { g: [1000, "kg"], ml: [1000, "l"], cl: [100, "l"] }[u], down = { kg: [1000, "g"], l: [100, "cl"] }[u];
  if (up && q >= up[0]) return [q / up[0], up[1]];
  if (down && q < 1) return [q * down[0], down[1]];
  return [q, u];
}
const ingText = i => [i.q != null ? fmtQty(i.q, i.u) : "", i.u, i.n].filter(Boolean).join(" ");
const mins = m => { m = +m || 0; return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? String(m % 60).padStart(2, "0") : ""}` : `${m} min`; };
const total = r => (+r.prep || 0) + (+r.cuisson || 0) + (+r.repos || 0);
// « de beurre », « d'huile » : le nom d'ingrédient sous la quantité, comme sur une fiche cuisine
// (« 3 œufs » sans « de » ; pas d'élision devant y ni h aspiré : « de yaourt », « de haricots »)
const deName = i => i.q == null || !i.u ? i.n : (/^(h(?!aricot)|[aeiouéèêœ])/i.test(i.n) ? "d'" : "de ") + i.n;

// self-check
console.assert(JSON.stringify(parseLine("250 g de farine")) === '{"q":250,"u":"g","n":"farine"}');
console.assert(JSON.stringify(parseLine("1/2 c. à café de sel")) === '{"q":0.5,"u":"c. à café","n":"sel"}');
console.assert(JSON.stringify(parseLine("3 œufs")) === '{"q":3,"u":"","n":"œufs"}');
console.assert(JSON.stringify(parseLine("1 gousse d'ail")) === '{"q":1,"u":"gousse","n":"ail"}');
console.assert(JSON.stringify(parseLine("1,5 kg de bœuf")) === '{"q":1.5,"u":"kg","n":"bœuf"}');
console.assert(fmtQty(1.5, "") === "1½" && fmtQty(0.5, "") === "½" && fmtQty(333, "g") === "335");
console.assert(scaled(100, "cl").join() === "1,l" && scaled(1500, "g").join() === "1.5,kg" && scaled(0.6, "kg").join() === "600,g");
console.assert(fold("Crème Brûlée") === "creme brulee" && fold("Bœuf") === "boeuf");
console.assert(deName({ q: 2, u: "cl", n: "huile" }) === "d'huile" && deName({ q: 2, u: "g", n: "farine" }) === "de farine");
console.assert(deName({ q: 3, u: "", n: "œufs" }) === "œufs" && deName({ q: 1, u: "pot", n: "yaourt" }) === "de yaourt" && deName({ q: 500, u: "g", n: "haricots rouges" }) === "de haricots rouges");

// stockage sur le téléphone (localStorage peut être bloqué : navigation privée, etc.)
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

let base = [], perso = store.get("bd-recettes", []), favs = new Set(store.get("bd-favoris", []));
let loaded = false, loadError = false, recipes = [], filter = "Tous", currentId = null, persons = 0, editingId = null, confirmDel = false;
let view = "list", tab = "list";       // tab = onglet actif de la barre du bas
const checked = new Set();             // ingrédients touchés sur la fiche ouverte

const norm = r => ({ ...r, ingredients: (r.ingredients || []).map(i => typeof i === "string" ? parseLine(i) : i) });
function sync() {
  recipes = [...base.map(r => ({ ...norm(r), base: true })), ...perso.map(norm)].sort((a, b) => a.titre.localeCompare(b.titre, "fr"));
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.hidden = true, 2200);
}

function setView(v) {
  view = v;
  for (const s of ["list", "detail", "edit"]) $(s).hidden = s !== (v === "favs" ? "list" : v);
  const sec = $(v === "favs" ? "list" : v);
  sec.classList.remove("view-enter"); void sec.offsetWidth; sec.classList.add("view-enter");
  window.scrollTo(0, 0);
  renderHeader(); renderTabs();
}

function renderHeader() {
  const r = recipes.find(x => x.id === currentId);
  if (view === "list" || view === "favs") {
    $("hbar").innerHTML = `<h1 class="logo">Le Bon <span>Dosage</span></h1>
      <button class="round" data-tab="favs" aria-label="Mes favoris">${icon("heart")}</button>`;
  } else if (view === "detail" && r) {
    $("hbar").innerHTML = `<button class="ghost" data-act="back" aria-label="Retour">${icon("back")}</button>
      <span class="htitle">${esc(r.titre)}</span>`;
  } else if (view === "edit") {
    $("hbar").innerHTML = `<button class="ghost" data-act="cancel" aria-label="Annuler">${icon("back")}</button>
      <span class="htitle">${editingId ? "Modifier la recette" : "Nouvelle recette"}</span>`;
  }
}

function renderTabs() {
  for (const b of document.querySelectorAll("nav.tabs button"))
    b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
}

const favLabel = id => favs.has(id) ? "Retirer des favoris" : "Ajouter aux favoris";
const card = r => `<article class="card">
    <div class="pic" aria-hidden="true">${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy" decoding="async">` : esc((r.titre || "?").trim()[0].toUpperCase())}</div>
    <button class="open" data-id="${esc(r.id)}"><h3>${esc(r.titre)}</h3>
      <span class="meta">${mins(total(r))} · ${esc(r.difficulte)}${r.base ? "" : ` · <span class="mine">Ma recette</span>`}</span></button>
    <button class="fav" data-fav="${esc(r.id)}" aria-pressed="${favs.has(r.id)}" aria-label="${favLabel(r.id)}">${icon("heart")}</button>
  </article>`;

function renderList() {
  const onlyFavs = view === "favs";
  $("list-title").textContent = onlyFavs ? "Mes favoris" : filter === "Tous" ? "Nos recettes" : filter === "Autre" ? "Autres recettes" : `${filter}s`;
  $("chips").innerHTML = CATS.map(c => `<button aria-pressed="${c === filter}" data-cat="${c}">${c === "Tous" ? "Toutes" : c + "s"}</button>`).join("");
  const q = fold($("q").value.trim());
  const items = recipes.filter(r => (!onlyFavs || favs.has(r.id)) && (filter === "Tous" || r.categorie === filter) &&
    (!q || fold(r.titre).includes(q) || r.ingredients.some(i => fold(i.n).includes(q))));
  $("count").textContent = items.length ? `${items.length} recette${items.length > 1 ? "s" : ""}` : "";
  $("grid").innerHTML = items.map(card).join("");
  $("empty").hidden = items.length > 0 || !loaded;
  $("empty").textContent = loadError && !recipes.length ? "Impossible de charger les recettes. Vérifiez la connexion et rouvrez l'appli."
    : onlyFavs && !favs.size ? "Aucun favori pour l'instant. Touchez le cœur d'une recette pour la retrouver ici."
    : "Aucune recette ne correspond à votre recherche.";
}

function renderDetail() {
  const r = recipes.find(x => x.id === currentId);
  if (!r) { currentId = null; setView(tab); renderList(); return; }
  const base = +r.personnes || 1, k = persons / base;
  const more = recipes.filter(x => x.categorie === r.categorie && x.id !== r.id).slice(0, 8);
  $("detail").innerHTML = `
    <div class="r-head"><h1>${esc(r.titre)}</h1>
      <div class="tags"><span>${esc(r.categorie)}</span><span>Pour ${base} pers.</span>${r.base ? "" : "<span>Ma recette</span>"}</div></div>
    ${r.photo ? `<figure class="hero"><img src="${esc(r.photo)}" alt="${esc(r.titre)}">${r.credit
      ? `<figcaption>Photo : <a href="${esc(r.creditUrl)}" target="_blank" rel="noopener">${esc(r.credit)}</a></figcaption>` : ""}</figure>` : ""}
    <div class="facts">
      <span>${icon("clock")}${mins(total(r))}</span><i class="dot"></i>
      <span>${icon("toque")}${esc(r.difficulte)}</span><i class="dot"></i>
      <span>${icon("euro")}${esc(r.cout)}</span>
    </div>
    <div class="actions">
      <button class="round big fav" data-fav="${esc(r.id)}" aria-pressed="${favs.has(r.id)}" aria-label="${favLabel(r.id)}">${icon("heart")}</button>
      <button class="round big" data-act="share" aria-label="Partager la recette">${icon("share")}</button>
    </div>

    <div class="sec"><svg class="i"><use href="#i-basket"/></svg><h2>Ingrédients</h2></div>
    <div class="serv"><button data-act="minus" aria-label="Une personne de moins">−</button><output aria-live="polite">${persons} personne${persons > 1 ? "s" : ""}</output><button data-act="plus" aria-label="Une personne de plus">+</button></div>
    <ul class="ings">${r.ingredients.map((i, n) => {
      const [q, u] = i.q != null ? scaled(i.q * k, i.u) : [null, i.u];
      return `<li><button class="ing" data-ing="${n}" aria-pressed="${checked.has(n)}">${q != null ? `<b>${esc(fmtQty(q, u) + (u ? " " + u : ""))}</b>` : u ? `<b>${esc(u)}</b>` : ""}<span>${esc(deName(i))}</span></button></li>`;
    }).join("")}</ul>
    <p class="hint">Touchez un ingrédient pour le marquer comme prêt.</p>

    <div class="sec"><svg class="i"><use href="#i-whisk"/></svg><h2>Préparation</h2></div>
    <div class="times">
      <div class="tot">Temps total : <b style="display:inline">${mins(total(r))}</b></div>
      <div class="cols3"><div><b>Préparation</b>${mins(r.prep)}</div><div><b>Repos</b>${+r.repos ? mins(r.repos) : "-"}</div><div><b>Cuisson</b>${+r.cuisson ? mins(r.cuisson) : "-"}</div></div>
    </div>
    <ol class="steps">${(r.etapes || []).map((s, n) => `<li><h3>Étape ${n + 1}</h3><p>${esc(s)}</p></li>`).join("")}</ol>
    ${r.astuce ? `<div class="note"><h3>Astuce</h3><p>${esc(r.astuce)}</p></div>` : ""}
    ${r.comparatif ? `<div class="note"><h3>${icon("scale").replace('class="i"', 'class="i" style="width:18px;height:18px;vertical-align:-3px;color:var(--accent)"')} Comment nous avons dosé cette recette</h3><p>${esc(r.comparatif)}</p>
      <p class="src">Recettes comparées : ${(r.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nom)}</a>`).join(", ")}</p></div>` : ""}

    ${r.base ? "" : `<div class="r-actions">${confirmDel
      ? `<button class="danger" data-act="del-ok">Confirmer la suppression</button><button data-act="del-no">Annuler</button>`
      : `<button data-act="edit">Modifier</button><button class="danger" data-act="del">Supprimer</button>`}</div>`}

    ${more.length ? `<div class="sec"><svg class="i"><use href="#i-spark"/></svg><h2>Vous aimerez aussi</h2></div>
      <div class="more">${more.map(card).join("")}</div>` : ""}`;
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id); if (!r) return;
  currentId = id; persons = +r.personnes || 1; confirmDel = false; checked.clear(); setView("detail"); renderDetail();
}

function openEdit(r) {
  editingId = r?.id || null;
  $("f-titre").value = r?.titre || ""; $("f-cat").value = r?.categorie || "Plat"; $("f-pers").value = r?.personnes || 4;
  $("f-diff").value = r?.difficulte || "Facile"; $("f-cout").value = r?.cout || "Moyen";
  $("f-prep").value = r?.prep ?? 15; $("f-cuis").value = r?.cuisson ?? 0; $("f-repos").value = r?.repos ?? 0;
  $("f-ing").value = (r?.ingredients || []).map(ingText).join("\n");
  $("f-steps").value = (r?.etapes || []).join("\n"); $("f-tip").value = r?.astuce || ""; $("f-err").textContent = "";
  setFormPhoto(r?.photo || "");
  if (!r) { tab = "new"; currentId = null; }
  setView("edit");
}

// photo des recettes perso : réduite à 800 px en JPEG puis stockée en data URL avec la recette
// shortcut: localStorage (~5 Mo) tient une quarantaine de photos ; passer à IndexedDB au-delà
let formPhoto = "";
function setFormPhoto(src) {
  formPhoto = src;
  $("f-photo-prev").hidden = !src; if (src) $("f-photo-prev").src = src; else $("f-photo-prev").removeAttribute("src");
  $("f-photo-del").hidden = !src; $("f-photo-label").textContent = src ? "Changer la photo" : "Choisir une photo";
}
$("f-photo").addEventListener("change", e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = Object.assign(document.createElement("canvas"), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); setFormPhoto(c.toDataURL("image/jpeg", 0.72)); $("f-err").textContent = "";
  };
  img.onerror = () => { URL.revokeObjectURL(url); $("f-err").textContent = "Cette image n'a pas pu être lue. Essayez une photo JPEG ou PNG."; };
  img.src = url;
});
$("f-photo-del").addEventListener("click", () => setFormPhoto(""));

function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set("bd-favoris", [...favs]);
  for (const b of document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`)) {
    b.setAttribute("aria-pressed", favs.has(id)); b.setAttribute("aria-label", favLabel(id));
  }
  if (view === "favs") renderList();
}

async function share(r) {
  const url = location.origin + location.pathname + "#" + r.id;
  try {
    if (navigator.share) { await navigator.share({ title: r.titre, text: `${r.titre} — Le Bon Dosage`, url }); return; }
    await navigator.clipboard.writeText(url); toast("Lien copié");
  } catch (e) { if (e?.name !== "AbortError") toast("Partage impossible sur cet appareil"); }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const lines = id => $(id).value.split("\n").map(s => s.trim()).filter(Boolean);
  const data = {
    id: editingId || "p-" + Date.now().toString(36),
    titre: $("f-titre").value.trim(), categorie: $("f-cat").value, personnes: Math.max(1, Math.round(+$("f-pers").value || 1)),
    difficulte: $("f-diff").value, cout: $("f-cout").value,
    prep: Math.max(0, +$("f-prep").value || 0), cuisson: Math.max(0, +$("f-cuis").value || 0), repos: Math.max(0, +$("f-repos").value || 0),
    ingredients: lines("f-ing"), etapes: lines("f-steps"), astuce: $("f-tip").value.trim(),
    ...(formPhoto && { photo: formPhoto })
  };
  const err = !data.titre ? "Donnez un titre à la recette." : !data.ingredients.length ? "Ajoutez au moins un ingrédient."
    : !data.etapes.length ? "Ajoutez au moins une étape de préparation." : "";
  if (err) { $("f-err").textContent = err; return; }
  const next = perso.filter(r => r.id !== data.id).concat(data);
  if (!store.set("bd-recettes", next)) { $("f-err").textContent = "Impossible d'enregistrer sur ce téléphone : stockage plein ou navigation privée. Retirez la photo ou supprimez une ancienne recette."; return; }
  perso = next; sync();
  if (tab === "new") tab = "list";
  openRecipe(data.id);
});

$("q").addEventListener("input", renderList);

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.fav) { toggleFav(t.dataset.fav); return; }
  if (t.dataset.cat) { filter = t.dataset.cat; renderList(); return; }
  if (t.dataset.id) { openRecipe(t.dataset.id); return; }
  if (t.dataset.ing) { const n = +t.dataset.ing; checked.has(n) ? checked.delete(n) : checked.add(n); t.setAttribute("aria-pressed", checked.has(n)); return; }
  if (t.dataset.tab) {
    if (t.dataset.tab === "new") { openEdit(null); return; }
    tab = t.dataset.tab; currentId = null; setView(tab); renderList(); return;
  }
  const r = recipes.find(x => x.id === currentId);
  switch (t.dataset.act) {
    case "back": currentId = null; setView(tab); renderList(); break;
    case "cancel":
      if (tab === "new") tab = "list";
      if (currentId) { setView("detail"); renderDetail(); } else { setView(tab); renderList(); }
      break;
    case "share": share(r); break;
    case "plus": persons = Math.min(50, persons + 1); renderDetail(); break;
    case "minus": persons = Math.max(1, persons - 1); renderDetail(); break;
    case "edit": openEdit(r); break;
    case "del": confirmDel = true; renderDetail(); break;
    case "del-no": confirmDel = false; renderDetail(); break;
    case "del-ok": {
      const next = perso.filter(x => x.id !== currentId);
      if (!store.set("bd-recettes", next)) { confirmDel = false; renderDetail(); break; }
      perso = next; if (favs.has(currentId)) toggleFav(currentId);
      sync(); currentId = null; setView(tab); renderList();
      break;
    }
  }
});

sync(); setView("list"); renderList();
fetch("recettes.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { base = d; })
  .catch(() => { loadError = true; })
  .finally(() => {
    sync(); loaded = true; renderList();
    const id = location.hash.slice(1);
    if (id && recipes.some(r => r.id === id)) openRecipe(id);
  });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
